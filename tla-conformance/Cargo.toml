[package]
name = "tla-conformance"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Bounded execution and differential tests for the rewrite"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
flate2 = "1"

[dev-dependencies]
tla-bridge = { path = "../tla-bridge" }
tla-engine = { path = "../tla-engine" }
tla-eval = { path = "../tla-eval" }
tla-disk = { path = "../tla-disk" }
tla-model = { path = "../tla-model" }
tla-observe = { path = "../tla-observe" }
tla-values = { path = "../tla-values" }
