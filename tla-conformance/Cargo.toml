[package]
name = "tlaplus-conformance"
version.workspace = true
edition.workspace = true
publish = false
description = "Bounded execution and differential tests for the rewrite"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
flate2 = "1"

[dev-dependencies]
tlaplus-bridge = { path = "../tla-bridge" }
tlaplus-engine = { path = "../tla-engine" }
tlaplus-eval = { path = "../tla-eval" }
tlaplus-disk = { path = "../tla-disk" }
tlaplus-model = { path = "../tla-model" }
tlaplus-observe = { path = "../tla-observe" }
tlaplus-values = { path = "../tla-values" }
