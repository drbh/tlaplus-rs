[workspace]
members = ["tla-*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.metadata.architecture]
schema_version = 1
# Enforced by tla-stack-tests/tests/architecture.rs.

[workspace.metadata.architecture.groups]
"interfaces/cli" = "Command-line entry points and output"
"application/checker" = "The checker as a library: loading, binding, exploration and checks"
"frontend/native" = "Native parsing, syntax, module loading and lowering"
"frontend/faithful" = "Scoped adapter to faithful SANY and TLC, including IR lowering"
"semantics/ir" = "Shared expression representation, levels and transformations"
"semantics/values" = "Finite values and deferred set/function expressions"
"runtime/evaluation" = "IR interpretation and supported standard-library operators"
"runtime/model" = "Configured models, state generation and transition-system hooks"
"runtime/exploration" = "Serial and parallel graph exploration and safety checking"
"verification/temporal" = "Temporal preparation, behavior graphs and liveness checking"
"infrastructure/storage" = "Disk exploration, codecs and persistent storage"
"infrastructure/observability" = "Timing and trace instrumentation"
"validation/conformance" = "Oracle contracts, differential runners and semantic corpora"

[workspace.metadata.architecture.crates]
tla-cli = "interfaces/cli"
tla-dsl = "frontend/native"
tla-oracle-cli = "interfaces/cli"
tla-checker = "application/checker"
tla-syntax = "frontend/native"
tla-parser = "frontend/native"
tla-modules = "frontend/native"
tla-lower = "frontend/native"
tla-bridge = "frontend/faithful"
tla-ir = "semantics/ir"
tla-values = "semantics/values"
tla-value-expr = "semantics/values"
tla-eval = "runtime/evaluation"
tla-library = "runtime/evaluation"
tla-random = "runtime/evaluation"
tla-runtime = "runtime/evaluation"
tla-model = "runtime/model"
tla-engine = "runtime/exploration"
tla-temporal = "verification/temporal"
tla-props = "verification/temporal"
tla-disk = "infrastructure/storage"
tla-observe = "infrastructure/observability"
tla-oracle = "validation/conformance"
tla-conformance = "validation/conformance"
tla-stack-tests = "validation/conformance"
tla-value-conformance = "validation/conformance"

[workspace.metadata.architecture.allowed.normal]
"interfaces/cli" = ["application/checker", "frontend/native", "infrastructure/observability", "semantics/values", "validation/conformance"]
"application/checker" = ["frontend/native", "infrastructure/observability", "infrastructure/storage", "runtime/exploration", "runtime/model", "semantics/ir", "semantics/values", "verification/temporal"]
"frontend/native" = ["semantics/ir"]
"frontend/faithful" = ["runtime/exploration", "runtime/model", "semantics/ir", "semantics/values", "validation/conformance"]
"runtime/evaluation" = ["semantics/ir", "semantics/values"]
"runtime/model" = ["runtime/evaluation", "runtime/exploration", "semantics/ir"]
"verification/temporal" = ["frontend/native", "runtime/exploration", "runtime/model", "semantics/ir", "semantics/values"]
"infrastructure/storage" = ["runtime/exploration", "semantics/values"]
"infrastructure/observability" = ["runtime/exploration"]

[workspace.metadata.architecture.allowed.dev]
"frontend/faithful" = ["validation/conformance"]
"validation/conformance" = ["frontend/faithful", "infrastructure/observability", "infrastructure/storage", "runtime/evaluation", "runtime/exploration", "runtime/model", "semantics/ir", "semantics/values"]

[workspace.metadata.architecture.allowed.build]
