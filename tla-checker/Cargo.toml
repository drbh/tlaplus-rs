tlaplus-model = { path = "../tla-model", version = "0.1.0" }
tlaplus-engine = { path = "../tla-engine", version = "0.1.0" }
tlaplus-temporal = { path = "../tla-temporal", version = "0.1.0" }
tlaplus-props = { path = "../tla-props", version = "0.1.0" }
tlaplus-disk = { path = "../tla-disk", version = "0.1.0" }
tlaplus-observe = { path = "../tla-observe", version = "0.1.0" }
